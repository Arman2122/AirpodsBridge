name: Feature request
description: Propose a change to an AirpodsBridge feature or workflow.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [existing requests](https://github.com/Arman2122/AirpodsBridge/issues?q=is%3Aissue+label%3Aenhancement)
        and the [project scope](https://github.com/Arman2122/AirpodsBridge/blob/main/CONTRIBUTING.md#scope).
        Use [Ideas](https://github.com/Arman2122/AirpodsBridge/discussions/categories/ideas) to discuss an early proposal.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow and what gets in your way.
      placeholder: I can never tell which bud is running low before it cuts out.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Include the affected model or operating mode if the request is device-specific.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including any existing setting or workaround that nearly does the job.

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Mockups, screenshots from other tools, or links to relevant discussion.
