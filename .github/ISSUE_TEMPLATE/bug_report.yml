name: Bug report
description: Something does not work the way it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        Please [search the existing issues](https://github.com/Arman2122/AirpodsBridge/issues?q=is%3Aissue)
        first — a quick check saves everyone a duplicate.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the problem, and what you expected instead.
      placeholder: |
        Ear detection stopped pausing playback after I reconnected the buds.
        I expected playback to pause when I removed the left bud.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AirpodsBridge version
      description: Shown in Settings → About.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver`, or check Settings → System → About.
      placeholder: "Windows 11 24H2 (build 26100)"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - AirPods 1
        - AirPods 2
        - AirPods 3
        - AirPods 4
        - AirPods 4 (ANC)
        - AirPods Pro
        - AirPods Pro 2
        - AirPods Pro 2 (USB-C)
        - AirPods Pro 3
        - AirPods Max
        - AirPods Max (USB-C)
        - Beats Fit Pro
        - Powerbeats 3
        - BeatsX
        - BeatsSolo3
        - Other / not listed
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Trace log
      description: |
        Launch AirpodsBridge with `--trace`, reproduce the problem, then paste
        `AirpodsBridge.log` from `%LOCALAPPDATA%\AirpodsBridge`.

        Bluetooth issues are very hard to act on without this.
      render: text

  - type: textarea
    id: stacktrace
    attributes:
      label: Stack trace
      description: The contents of `StackTrace.log`, if the application crashed.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, recordings, or context that might matter.
