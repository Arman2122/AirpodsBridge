name: Bug report
description: Report a reproducible problem with AirpodsBridge.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the [troubleshooting guide](https://github.com/Arman2122/AirpodsBridge/wiki/Troubleshooting)
        and [search existing issues](https://github.com/Arman2122/AirpodsBridge/issues?q=is%3Aissue).
        Use [private reporting](https://github.com/Arman2122/AirpodsBridge/security/advisories/new) for security vulnerabilities.

  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
      description: Describe what happened and what you expected to see or hear.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the starting state, shortest steps, and how often it happens. If it started after an update, include the last working version if known.
      placeholder: |
        1. Connect the earbuds and start playback.
        2. Take out the left earbud, then put it back in.
        3. Playback stays paused every time.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AirpodsBridge version
      description: Find this in Settings → About. Include installer, portable ZIP, or source build.
      placeholder: v1.1.0, installer
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Run `winver`.
      placeholder: Windows 11 24H2, build 26100
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Operating mode
      options:
        - Standard (BLE)
        - Control Engine active
        - Control Engine setup or restore
        - Unsure or unable to launch
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Headphone and Bluetooth adapter models
      description: Include the exact AirPods or Beats model and the adapter shown in Device Manager, if known.
      placeholder: AirPods Pro 2 (USB-C), Intel AX210

  - type: textarea
    id: diagnostics
    attributes:
      label: Logs, screenshots, or additional details
      description: |
        For Bluetooth problems, follow the [trace guide](https://github.com/Arman2122/AirpodsBridge/wiki/Troubleshooting#collect-a-trace).
        For a crash, include `StackTrace.log` if available. Before attaching anything, remove Bluetooth addresses,
        serial numbers, usernames, and other personal information. These issues are public.
